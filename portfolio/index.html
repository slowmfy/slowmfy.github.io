<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Optimisateur de Trajet</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background-color: #f4f6f8;
    }

    header {
      background-color: #1e293b;
      color: white;
      padding: 16px;
      text-align: center;
    }

    .container {
      display: flex;
      padding: 20px;
      gap: 20px;
    }

    /* MAP SECTION */
    .map-container {
      flex: 3;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .map-placeholder {
      height: 420px;
      background-color: #dbeafe;
      border: 2px dashed #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: #1e40af;
    }

    /* STATS */
    .stats {
      display: flex;
      justify-content: space-between;
      background: white;
      padding: 12px;
      border-radius: 8px;
    }

    .stat {
      font-size: 14px;
    }

    /* CONTROLS */
    .controls {
      flex: 1;
      background-color: white;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .controls label {
      font-weight: bold;
      font-size: 14px;
    }

    .controls textarea {
      height: 100px;
      resize: none;
    }

    .controls input,
    .controls textarea {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
    }

    /* BUTTONS */
    .btn {
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate {
      background-color: #38bdf8;
      color: #082f49;
    }

    .optimize {
      background-color: #22c55e;
      color: #052e16;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <header>
    <h1>Optimisateur de Trajet</h1>
  </header>

  <main class="container">

    <!-- MAP -->
    <section class="map-container">
      <div class="map-placeholder">
        MAP
      </div>

      <!-- STATS -->
      <div class="stats">
        <div class="stat">
          <strong>Durée moyenne de trajet :</strong> --
        </div>
        <div class="stat">
          <strong>Écart-type durée de trajet :</strong> --
        </div>
        <div class="stat">
          <strong>Adresses non assignées :</strong> --
        </div>
      </div>
    </section>

    <!-- CONTROLS -->
    <aside class="controls">

      <label>Points / Localisations</label>
      <textarea placeholder="Ex : Paris, Lyon, Marseille..."></textarea>

      <button class="btn generate">Générer</button>

      <label>Nombre de véhicules</label>
      <input type="number" min="1" placeholder="Ex : 5" />

      <label>Temps max par véhicule</label>
      <input type="number" min="1" placeholder="Ex : 120 (min)" />

      <button class="btn optimize">Optimiser</button>

    </aside>

  </main>

</body>
</html>
